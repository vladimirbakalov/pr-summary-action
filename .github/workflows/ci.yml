name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify dist/ matches source
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is stale — run 'npm run build' and commit the result."
            exit 1
          fi
